[project]
name = "keypi-chromehistory"
version = "1.0.0"
description = "Chrome History Keypirinha Plugin - preprocessing and tests"
requires-python = ">=3.8"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
exclude = [
    "chrome-history.py",        # legacy file, superseded by chrome_history_preprocess.py
    "plugin-chrome-history.py", # legacy file, superseded by __init__.py
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
