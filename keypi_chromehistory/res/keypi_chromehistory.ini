[main]
# Keyword to trigger the plugin in Keypirinha (default: ch)
keyword = ch

# Path to the preprocessed CSV file.
# Run chrome_history_preprocess.py first to generate this file.
# Supports Windows environment variables like %USERPROFILE%
csv_path = %USERPROFILE%\Documents\tmp\chrome-history-clean.csv


[preprocess]
# Path to Chrome's SQLite history database (do not change unless using a
# different Chrome profile or a Chromium-based browser)
chrome_db = %LOCALAPPDATA%\Google\Chrome\User Data\Default\History

# Where to save the preprocessed CSV
output_csv = %USERPROFILE%\Documents\tmp\chrome-history-clean.csv

# URL filter: only keep entries whose URL contains this string.
# Leave empty to include ALL browser history.
# Example: url_filter = company.atlassian.net
url_filter =


[filter_out_titles]
# Comma-separated list of substrings to exclude from page titles.
# Case-insensitive. An entry is excluded if its title contains any of these.
# Example: exclude = Login, Search, 404
exclude = Login, Anmelden


[filter_out_urls]
# Comma-separated list of substrings to exclude from URLs.
# Case-insensitive. An entry is excluded if its URL contains any of these.
# Example: exclude = editpage, createpage
exclude = editpage, createpage, edit-v2, broker
