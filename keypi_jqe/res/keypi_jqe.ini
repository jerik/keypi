[main]
# Your Jira Cloud instance URL (e.g., https://your-domain.atlassian.net)
# Do NOT include a trailing slash
jira_url =

# Your Atlassian account email address
atlassian_email =

# Your Atlassian API token
# Create one at: https://id.atlassian.com/manage-profile/security/api-tokens
# IMPORTANT: Keep this token secure! Never commit this file with your token to version control.
atlassian_api_key =

# Keyword to trigger the plugin (default: jqe)
# Change this to customize the command you type in Keypirinha
keyword = jqe


# Future feature: JQL shortcuts (Phase 2)
# Uncomment and customize these when the feature is implemented
#[jql_shortcuts]
#me = assignee = currentUser()
#open = status = "Open"
#my_open = assignee = currentUser() AND status = "Open"
