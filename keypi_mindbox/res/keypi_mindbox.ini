[main]
# Path to the folder containing your .mb files
# Example: C:\Users\YourName\Documents\Mindbox
mindbox_folder =

# Keyword to trigger the plugin (default: mb)
# Change this to customize the command you type in Keypirinha
keyword = mb

# Path to the update script (.cmd) that refreshes the Mindbox files
# Use #update or #up in the plugin to run this script
# The script runs hidden (no CMD window)
# Example: C:\Users\YourName\Scripts\update-mindbox.cmd
update_script =
