[main]
# Keyword to trigger the plugin (default: wl)
keyword = wl

# Path to the Windows event log export that holds the logon/logoff events.
# Default: <Documents>\logs\winevent.log
# Example: C:\Users\YourName\Documents\logs\winevent.log
winevent_log =

# Journal file the working hours are appended to.
# The file and its folder are created automatically.
# Default: <Documents>\logs\Journal.log
journal_file =

# Break variants offered after selecting an entry, in minutes.
# 0 = no break. Variants that leave no working time are hidden.
# Default: 0, 60, 90  ->  "8h no break", "7h 1h break", "6,5h 1,5h break"
break_options = 0, 60, 90

# Rounding of the working time in minutes (1-60).
# The rounding is applied to the difference, not to start and end separately:
# 09:04 to 17:09 is 8h05m and becomes 8h.
rounding_minutes = 15

# Number of logon events shown in the list (1-500)
max_entries = 30

# Event source that identifies the relevant log lines. Lines from other
# sources are ignored, even when they contain the markers below.
event_source = EventLog

# Wording that marks a logon and a logoff event. Adjust these for a
# non-German Windows installation.
event_start_marker = gestartet
event_stop_marker = beendet

# Templates for the journal entry.
# Placeholders: {weekday} Mo-So, {date} YYYY-MM-DD, {time} HHMM:SS,
#               {clock} HH:MM, {week} ISO week, {hours} e.g. 7h
#
# The default produces:
#   # Mi 2026-08-19 1709:44
#   @arbeitsstunden am 2026-08-19: 7h
journal_header = # {weekday} {date} {time}
journal_entry = @arbeitsstunden am {date}: {hours}
