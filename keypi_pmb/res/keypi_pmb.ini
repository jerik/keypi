[main]
# Keyword to trigger the plugin in Keypirinha (default: pmb)
keyword = pmb

# Path to the pm-buddy SQLite database
# Default location on Windows: %USERPROFILE%\.pm-buddy\pm-buddy.db
# You can use environment variables like %USERPROFILE% or %APPDATA%
db_path = %USERPROFILE%\.pm-buddy\pm-buddy.db

# Path to the folder containing PM management files (.md files named TICKET-KEY.md)
# Supports OneDrive and other folders with spaces in the path.
# Leave empty to disable PMM features.
# Example: C:\Users\YourName\OneDrive\PM Files
pmm_folder =
