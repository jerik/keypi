[main]
# Your Confluence Cloud instance URL (e.g., https://your-domain.atlassian.net)
# Do NOT include a trailing slash or /wiki
confluence_url =

# Your Atlassian account email address
atlassian_email =

# Your Atlassian API token
# Create one at: https://id.atlassian.com/manage-profile/security/api-tokens
# IMPORTANT: Keep this token secure! Never commit this file with your token to version control.
atlassian_api_key =

# Keyword to trigger the plugin (default: cqe)
# Change this to customize the command you type in Keypirinha
keyword = cqe

# Maximum number of history entries to keep (default: 30)
# History stores your recently executed CQL queries for quick re-use
# Access via: cqe #history
history_max_entries = 30

# CQL Shortcuts Section
# Define shortcuts for frequently used CQL queries
# Format: shortcut_name = cql_query
# Usage: In Keypirinha, type "cqe" then "#shortcut_name"
#        Type just "#" to see all available shortcuts
#        Type "#edit" to open this config file
[cqe_shortcuts]
# Example shortcuts (customize these for your needs):
# myco = title ~ konzept and creator = currentUser()
# mytodo = title ~ todo and creator = currentUser()
# recent = lastModified >= now("-7d") ORDER BY lastModified DESC
