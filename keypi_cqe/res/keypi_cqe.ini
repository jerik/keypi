[main]
# Your Confluence Cloud instance URL (e.g., https://your-domain.atlassian.net)
# Do NOT include a trailing slash or /wiki
confluence_url =

# Your Atlassian account email address
atlassian_email =

# Your Atlassian API token
# Create one at: https://id.atlassian.com/manage-profile/security/api-tokens
# IMPORTANT: Keep this token secure! Never commit this file with your token to version control.
atlassian_api_key =

# Keyword to trigger the plugin (default: cqe)
# Change this to customize the command you type in Keypirinha
keyword = cqe
